# Declarative manifest of file-content markers that every Scaffolde patch
# adds to the fork. The upstream-sync workflow asserts each marker is
# present in HEAD after merging NousResearch upstream, so a clean upstream
# change that silently removes a patched file or reverts a patched line is
# caught at merge time instead of at runtime.
#
# Add a new entry every time you land a Scaffolde patch that has a stable
# textual signature. Prefer high-signal substrings: function names, class
# names, distinctive comment text, env var names. Avoid markers that would
# naturally drift (timestamps, version numbers, line counts).

patches:
  - description: upstream-sync workflow itself (this enforcement mechanism)
    path: .github/workflows/upstream-sync.yml
    contains:
      - SCAFFOLDE_PATCH_AUTHOR_PATTERN
      - sync/upstream-main
      - upstream-sync-conflict

  - description: scaffolde-patches manifest (this file)
    path: .scaffolde-patches.yaml
    contains:
      - "patches:"

  - description: Slack gateway — user-token bridge + mentioned-thread bookkeeping
    path: gateway/platforms/slack.py
    contains:
      - SLACK_USER_TOKEN
      - MENTIONED_THREADS_MAX

  - description: WhatsApp gateway — stale-session and port-reclaim hardening
    path: gateway/platforms/whatsapp.py
    contains:
      - _close_stale_session
      - _cancel_stale_poll
      - _kill_port_process

  - description: Chat-completions transport — NVIDIA DeepSeek V4 Pro slow-stream path
    path: agent/transports/chat_completions.py
    contains:
      - is_nvidia_deepseek_v4_pro

  - description: hermes doctor — runtime-gated tool availability split + Gemini native key probe
    path: hermes_cli/doctor.py
    contains:
      - _split_runtime_gated_tool_availability
      - _tool_unavailable_reason
      - generativelanguage.googleapis.com

  - description: auxiliary clients — configurable auto provider fallback chain
    path: agent/auxiliary_client.py
    contains:
      - _DEFAULT_AUTO_PROVIDER_CHAIN
      - auxiliary.auto_provider_chain

  - description: WhatsApp bridge — link-preview-js dependency without legacy url shim
    path: scripts/whatsapp-bridge/package.json
    contains:
      - '"link-preview-js": "^4.0.3"'

  - description: hermes CLI — NVIDIA model-name normalization (fork-new module)
    path: hermes_cli/model_normalize.py
    contains:
      - _normalize_for_nvidia

  - description: hermes CLI — dashboard health probe (fork-new module)
    path: hermes_cli/dashboard_health.py
    contains:
      - class DashboardProbeResult
      - def probe_dashboard

  - description: Obsidian memory provider plugin (fork-new module)
    path: plugins/memory/obsidian/__init__.py
    contains:
      - class ObsidianMemoryProvider
