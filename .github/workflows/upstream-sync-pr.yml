name: Upstream Sync PR

on:
  schedule:
    # Every 4 hours, offset from top-of-hour GitHub Actions congestion.
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync-pr
  cancel-in-progress: true

jobs:
  sync:
    name: Create reviewed upstream sync PR
    if: github.repository == 'pai-scaffolde/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Detect GitHub App credentials
        id: app-auth
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "has_app_token=true" >> "$GITHUB_OUTPUT"
            echo "token_source=github-app" >> "$GITHUB_OUTPUT"
          else
            echo "has_app_token=false" >> "$GITHUB_OUTPUT"
            echo "token_source=github-token" >> "$GITHUB_OUTPUT"
            echo "::warning::APP_ID/APP_PRIVATE_KEY are not configured; falling back to GITHUB_TOKEN. Branch pushes/PR updates may not trigger every downstream workflow automatically."
          fi

      # Prefer repository GitHub App credentials so branch pushes/PR updates
      # trigger the normal pull_request CI gates. When the app is not installed,
      # keep the scheduled sync alive with GITHUB_TOKEN and make the weaker
      # downstream-trigger behavior explicit in the logs.
      - name: Generate GitHub App token
        id: app-token
        if: steps.app-auth.outputs.has_app_token == 'true'
        uses: actions/create-github-app-token@7bfa3a4717ef143a604ee0a99d859b8886a96d00 # v1.9.3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout fork main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Create or update upstream sync PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          BRANCH: automation/upstream-sync
          UPSTREAM_URL: https://github.com/NousResearch/hermes-agent.git
          TOKEN_SOURCE: ${{ steps.app-auth.outputs.token_source }}
        run: |
          set -euo pipefail

          if [ "$TOKEN_SOURCE" = "github-token" ]; then
            echo "::notice::Using GITHUB_TOKEN fallback because APP_ID/APP_PRIVATE_KEY are absent. Reviewers may need to rerun PR checks manually."
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git remote add upstream "$UPSTREAM_URL"
          git fetch origin main
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "Fork main already contains upstream/main; nothing to sync."
            exit 0
          fi

          git checkout -B "$BRANCH" origin/main

          # Patch-stack model: replay the fork's PAI commits on top of the new
          # upstream instead of merging upstream in. A `--no-ff` merge re-introduces
          # the pre-rebase copies of every PAI patch on each run, which is exactly
          # what produced the duplicated-commit history this workflow used to create.
          # Rebasing keeps `main` linear (upstream/main + the PAI patch series, no
          # merge commits) and surfaces any conflict once, per patch.
          if ! git rebase upstream/main; then
            git rebase --abort || true
            {
              echo "### Upstream sync needs manual rebase"
              echo ""
              echo "Rebasing the PAI patch stack onto upstream/main hit conflicts."
              echo ""
              echo "Resolve locally, then force-update main:"
              echo ""
              echo '```bash'
              echo "git fetch upstream && git checkout main && git rebase upstream/main"
              echo "# resolve conflicts, then:"
              echo "git push --force-with-lease origin main"
              echo '```'
              echo ""
              echo "The existing $BRANCH branch was left untouched."
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ]; then
              echo "::warning::Rebasing PAI patches onto upstream/main hit conflicts. Scheduled runs report this as manual sync required without failing repeatedly."
              exit 0
            fi

            echo "::error::Rebasing PAI patches onto upstream/main hit conflicts."
            echo "Resolve locally, then force-update main:"
            echo "  git fetch upstream && git checkout main && git rebase upstream/main"
            echo "  # resolve conflicts, then:"
            echo "  git push --force-with-lease origin main"
            echo "Left the existing $BRANCH untouched for manual resolution."
            exit 1
          fi

          git push --force-with-lease origin "HEAD:$BRANCH"

          cat > /tmp/upstream-sync-pr-body.md <<'EOF'
          Automated upstream sync from NousResearch/hermes-agent into pai-scaffolde/hermes-agent.

          This branch is `upstream/main` with the PAI patch series **rebased** on top -
          a linear patch stack, no merge commits. Review the diff and let CI run here.

          Policy:
          - This PR is review-gated. Do not auto-merge blindly.
          - Existing CI/checks must pass before landing.
          - Land by fast-forwarding `main` to this branch - do NOT use the green
            "Merge" button (a merge commit reintroduces the dual-history problem).
            From a clean checkout:
            ```
            git fetch origin
            git checkout main
            git reset --hard origin/automation/upstream-sync
            git push --force-with-lease origin main
            ```
          - If the workflow used the GITHUB_TOKEN fallback, PR checks may need a
            manual rerun because workflow-created pushes do not always trigger
            downstream workflows.
          - If the rebase conflicted, this PR was not updated; resolve locally per the
            failed job log and force-update `main` directly.

          Source:
          - upstream: NousResearch/hermes-agent main
          - fork base: pai-scaffolde/hermes-agent main (PAI patch stack)
          EOF

          PR_NUMBER="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --title "chore: sync from NousResearch/hermes-agent upstream" \
              --body-file /tmp/upstream-sync-pr-body.md
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "chore: sync from NousResearch/hermes-agent upstream" \
              --body-file /tmp/upstream-sync-pr-body.md
          fi
