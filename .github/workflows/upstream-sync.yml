name: Sync Nous upstream

"on":
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  SYNC_BRANCH: sync/upstream-main
  TRACKING_LABEL: upstream-sync-conflict
  # Declarative manifest of file markers every Scaffolde patch leaves on
  # the fork. The post-merge guard asserts each marker is still present in
  # the working tree after a clean merge with upstream.
  PATCHES_MANIFEST: .scaffolde-patches.yaml
  # git log --author= regex matched against the "Name <email>" form. Used
  # only for log/PR-body context; the survival guard itself is content-based.
  SCAFFOLDE_PATCH_AUTHOR_PATTERN: pai@scaffolde\.ai

jobs:
  sync:
    name: Merge upstream/main into fork PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "pai-scaffolde-upstream-sync"
          git config user.email "actions@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch origin main
          git fetch upstream main

      - name: Count Scaffolde patch commits (informational)
        id: patches
        run: |
          set -euo pipefail
          # Informational only: how many Scaffolde-authored commits are
          # reachable from fork main but not from upstream main. The real
          # survival guard runs against ${PATCHES_MANIFEST} after the merge,
          # because in a --no-ff merge every captured SHA is trivially still
          # an ancestor of HEAD (first-parent reachability), so a SHA-based
          # check cannot detect content-level patch loss.
          PATCH_COUNT="$(git log --format='%H' \
            --author="${SCAFFOLDE_PATCH_AUTHOR_PATTERN}" \
            origin/main ^upstream/main | wc -l | tr -d ' ')"
          echo "${PATCH_COUNT} Scaffolde-authored commits on fork main not in upstream."
          echo "patch_count=${PATCH_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Merge upstream into sync branch
        id: merge
        run: |
          set -euo pipefail
          git checkout -B "${SYNC_BRANCH}" origin/main

          UPSTREAM_SHA="$(git rev-parse upstream/main)"
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "${UPSTREAM_SHA}" HEAD; then
            echo "result=up-to-date" >> "$GITHUB_OUTPUT"
            echo "Fork main already contains upstream/main ${UPSTREAM_SHA}; nothing to do."
            exit 0
          fi

          if git merge --no-ff --no-edit upstream/main; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
            echo "Merged NousResearch/hermes-agent@${UPSTREAM_SHA} cleanly."
          else
            git status --short
            CONFLICTS="$(git diff --name-only --diff-filter=U | tr '\n' ' ')"
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            echo "conflicts=${CONFLICTS}" >> "$GITHUB_OUTPUT"
            git merge --abort || true
          fi

      - name: Verify Scaffolde patch markers survived merge
        if: steps.merge.outputs.result == 'merged'
        id: verify
        run: |
          set -euo pipefail
          if [ ! -f "${PATCHES_MANIFEST}" ]; then
            {
              echo "## Hermes upstream sync — patches manifest missing"
              echo ""
              echo "\`${PATCHES_MANIFEST}\` is not present in the merged tree."
              echo "It either never existed on this fork or the upstream merge removed it."
              echo "Refusing to push the sync branch."
            } >> "$GITHUB_STEP_SUMMARY"
            printf '::error title=Patches manifest missing::%s not found after merge\n' "${PATCHES_MANIFEST}"
            exit 1
          fi
          python3 - <<'PY'
          import os, sys, yaml
          manifest_path = os.environ["PATCHES_MANIFEST"]
          with open(manifest_path, encoding="utf-8") as fh:
              manifest = yaml.safe_load(fh) or {}
          entries = manifest.get("patches", []) or []
          failures = []
          checked_markers = 0
          for entry in entries:
              path = entry.get("path")
              needles = entry.get("contains") or []
              if not path:
                  failures.append(f"manifest entry missing 'path': {entry!r}")
                  continue
              if not os.path.exists(path):
                  failures.append(f"{path}: file missing after merge")
                  continue
              with open(path, encoding="utf-8", errors="replace") as fh:
                  content = fh.read()
              for needle in needles:
                  checked_markers += 1
                  if needle not in content:
                      failures.append(f"{path}: missing marker {needle!r}")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if failures:
              report = ["## Hermes upstream sync — patch survival check FAILED", ""]
              report.append(f"{len(failures)} marker(s) missing after merging upstream:")
              report.append("")
              for f in failures:
                  report.append(f"- {f}")
              report.append("")
              report.append("Refusing to push the sync branch. Investigate locally before retrying.")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as fh:
                      fh.write("\n".join(report) + "\n")
              print("\n".join(report))
              sys.exit(1)
          print(f"All {checked_markers} marker(s) across {len(entries)} file(s) in {manifest_path} survived the merge.")
          PY

      - name: Push sync branch
        if: steps.merge.outputs.result == 'merged'
        run: git push --force-with-lease origin "${SYNC_BRANCH}"

      - name: Open or update PR
        if: steps.merge.outputs.result == 'merged'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UPSTREAM_SHA="${{ steps.merge.outputs.upstream_sha }}"
          PATCH_COUNT="${{ steps.patches.outputs.patch_count }}"
          BODY="$(cat <<EOF
          Daily fork sync from NousResearch/hermes-agent@${UPSTREAM_SHA}.

          This PR intentionally keeps Scaffolde-specific patches in pai-scaffolde/hermes-agent and does not contribute changes back upstream.

          Patch-survival guard: file markers declared in \`${PATCHES_MANIFEST}\` verified present in the merged tree. (${PATCH_COUNT} Scaffolde-authored commit(s) on fork main not in upstream.)

          Merge policy:
          - review conflicts and Scaffolde patch files carefully
          - never rebase fork main
          - merge only after tests pass
          - the scaffolde-ai \`upstream/hermes/source.yaml\` pin auto-bumps after this lands via the hermes-pin-bump workflow
          EOF
          )"

          EXISTING="$(gh pr list --head "${SYNC_BRANCH}" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "${EXISTING}" ]; then
            gh pr edit "${EXISTING}" \
              --title "chore: sync NousResearch upstream into Hermes fork" \
              --body "${BODY}"
            gh pr comment "${EXISTING}" --body "Refreshed upstream sync branch to NousResearch/hermes-agent@${UPSTREAM_SHA}."
          else
            gh pr create \
              --head "${SYNC_BRANCH}" \
              --base main \
              --title "chore: sync NousResearch upstream into Hermes fork" \
              --body "${BODY}"
          fi

      - name: Open or update conflict tracking issue
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UPSTREAM_SHA="${{ steps.merge.outputs.upstream_sha }}"
          CONFLICTS="${{ steps.merge.outputs.conflicts }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TITLE="Upstream sync blocked: merge conflict from NousResearch upstream"
          BODY="$(cat <<EOF
          The daily upstream sync workflow could not auto-merge \`NousResearch/hermes-agent@${UPSTREAM_SHA}\` into \`pai-scaffolde/hermes-agent:main\`.

          **Conflicting paths:** \`${CONFLICTS:-unknown}\`

          ### Resolve

          \`\`\`
          git fetch origin main
          git fetch https://github.com/NousResearch/hermes-agent.git main:upstream-main
          git checkout main
          git merge upstream-main   # resolve conflicts, preserve Scaffolde patches
          git push origin main
          \`\`\`

          Do not rebase fork main. After the merge lands, the
          [hermes-pin-bump workflow](https://github.com/pai-scaffolde/scaffolde-ai/actions/workflows/hermes-pin-bump.yml)
          in scaffolde-ai will pick up the new fork SHA on its next schedule (or via workflow_dispatch).

          Workflow run: ${RUN_URL}
          EOF
          )"

          gh label create "${TRACKING_LABEL}" \
            --description "Upstream sync workflow conflict that needs human resolution" \
            --color B60205 \
            --force >/dev/null 2>&1 || true

          EXISTING="$(gh issue list --label "${TRACKING_LABEL}" --state open --json number --jq '.[0].number // empty')"
          if [ -n "${EXISTING}" ]; then
            gh issue edit "${EXISTING}" --title "${TITLE}" --body "${BODY}"
            gh issue comment "${EXISTING}" --body "Sync run ${{ github.run_id }} hit the same conflict. Latest upstream: \`${UPSTREAM_SHA}\`. Conflicts: \`${CONFLICTS:-unknown}\`."
          else
            gh issue create --title "${TITLE}" --body "${BODY}" --label "${TRACKING_LABEL}"
          fi

          printf '::error title=Hermes upstream sync conflict::Manual resolution required. Conflicts: %s\n' "${CONFLICTS:-unknown}"
          exit 1
