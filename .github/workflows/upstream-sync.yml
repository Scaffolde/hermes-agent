name: Sync Nous upstream

"on":
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  SYNC_BRANCH: sync/upstream-main
  TRACKING_LABEL: upstream-sync-conflict
  # git log --author= regex matched against the "Name <email>" form. Add
  # alternates with \| to track additional Scaffolde patch identities.
  SCAFFOLDE_PATCH_AUTHOR_PATTERN: pai@scaffolde\.ai

jobs:
  sync:
    name: Merge upstream/main into fork PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "pai-scaffolde-upstream-sync"
          git config user.email "actions@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch origin main
          git fetch upstream main

      - name: Capture Scaffolde patch commits (pre-merge)
        id: patches
        run: |
          set -euo pipefail
          PATCH_FILE="${RUNNER_TEMP}/scaffolde-patch-shas.txt"
          # Commits authored by a Scaffolde identity that are reachable from
          # fork main but NOT from upstream main. These are the deltas that
          # must remain ancestors of HEAD after the upstream merge.
          git log --format='%H' \
            --author="${SCAFFOLDE_PATCH_AUTHOR_PATTERN}" \
            origin/main ^upstream/main \
            > "${PATCH_FILE}"
          PATCH_COUNT="$(wc -l < "${PATCH_FILE}" | tr -d ' ')"
          echo "Captured ${PATCH_COUNT} Scaffolde-authored commits to verify post-merge."
          echo "patch_file=${PATCH_FILE}" >> "$GITHUB_OUTPUT"
          echo "patch_count=${PATCH_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Merge upstream into sync branch
        id: merge
        run: |
          set -euo pipefail
          git checkout -B "${SYNC_BRANCH}" origin/main

          UPSTREAM_SHA="$(git rev-parse upstream/main)"
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "${UPSTREAM_SHA}" HEAD; then
            echo "result=up-to-date" >> "$GITHUB_OUTPUT"
            echo "Fork main already contains upstream/main ${UPSTREAM_SHA}; nothing to do."
            exit 0
          fi

          if git merge --no-ff --no-edit upstream/main; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
            echo "Merged NousResearch/hermes-agent@${UPSTREAM_SHA} cleanly."
          else
            git status --short
            CONFLICTS="$(git diff --name-only --diff-filter=U | tr '\n' ' ')"
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            echo "conflicts=${CONFLICTS}" >> "$GITHUB_OUTPUT"
            git merge --abort || true
          fi

      - name: Verify Scaffolde patches survived merge
        if: steps.merge.outputs.result == 'merged'
        run: |
          set -euo pipefail
          PATCH_FILE="${{ steps.patches.outputs.patch_file }}"
          MISSING=()
          if [ -s "${PATCH_FILE}" ]; then
            while IFS= read -r SHA; do
              [ -z "${SHA}" ] && continue
              if ! git merge-base --is-ancestor "${SHA}" HEAD; then
                MISSING+=("${SHA}")
              fi
            done < "${PATCH_FILE}"
          fi
          if [ "${#MISSING[@]}" -gt 0 ]; then
            {
              echo "## Hermes upstream sync — patch survival check FAILED"
              echo ""
              echo "${#MISSING[@]} Scaffolde-authored commit(s) are not ancestors of the merged HEAD:"
              echo ""
              for SHA in "${MISSING[@]}"; do
                echo "- \`${SHA}\`"
              done
              echo ""
              echo "Refusing to push the sync branch. Investigate locally before retrying."
            } >> "$GITHUB_STEP_SUMMARY"
            printf '::error title=Hermes patch survival check failed::%s Scaffolde commit(s) missing from merged HEAD\n' "${#MISSING[@]}"
            exit 1
          fi
          echo "All ${{ steps.patches.outputs.patch_count }} Scaffolde patch commits survived the merge."

      - name: Push sync branch
        if: steps.merge.outputs.result == 'merged'
        run: git push --force-with-lease origin "${SYNC_BRANCH}"

      - name: Open or update PR
        if: steps.merge.outputs.result == 'merged'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UPSTREAM_SHA="${{ steps.merge.outputs.upstream_sha }}"
          PATCH_COUNT="${{ steps.patches.outputs.patch_count }}"
          BODY="$(cat <<EOF
          Daily fork sync from NousResearch/hermes-agent@${UPSTREAM_SHA}.

          This PR intentionally keeps Scaffolde-specific patches in pai-scaffolde/hermes-agent and does not contribute changes back upstream.

          Patch-survival guard: ${PATCH_COUNT} Scaffolde-authored commit(s) verified as ancestors of the merged HEAD.

          Merge policy:
          - review conflicts and Scaffolde patch files carefully
          - never rebase fork main
          - merge only after tests pass
          - the scaffolde-ai \`upstream/hermes/source.yaml\` pin auto-bumps after this lands via the hermes-pin-bump workflow
          EOF
          )"

          EXISTING="$(gh pr list --head "${SYNC_BRANCH}" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "${EXISTING}" ]; then
            gh pr edit "${EXISTING}" \
              --title "chore: sync NousResearch upstream into Hermes fork" \
              --body "${BODY}"
            gh pr comment "${EXISTING}" --body "Refreshed upstream sync branch to NousResearch/hermes-agent@${UPSTREAM_SHA}."
          else
            gh pr create \
              --head "${SYNC_BRANCH}" \
              --base main \
              --title "chore: sync NousResearch upstream into Hermes fork" \
              --body "${BODY}"
          fi

      - name: Open or update conflict tracking issue
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UPSTREAM_SHA="${{ steps.merge.outputs.upstream_sha }}"
          CONFLICTS="${{ steps.merge.outputs.conflicts }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TITLE="Upstream sync blocked: merge conflict from NousResearch upstream"
          BODY="$(cat <<EOF
          The daily upstream sync workflow could not auto-merge \`NousResearch/hermes-agent@${UPSTREAM_SHA}\` into \`pai-scaffolde/hermes-agent:main\`.

          **Conflicting paths:** \`${CONFLICTS:-unknown}\`

          ### Resolve

          \`\`\`
          git fetch origin main
          git fetch https://github.com/NousResearch/hermes-agent.git main:upstream-main
          git checkout main
          git merge upstream-main   # resolve conflicts, preserve Scaffolde patches
          git push origin main
          \`\`\`

          Do not rebase fork main. After the merge lands, the
          [hermes-pin-bump workflow](https://github.com/pai-scaffolde/scaffolde-ai/actions/workflows/hermes-pin-bump.yml)
          in scaffolde-ai will pick up the new fork SHA on its next schedule (or via workflow_dispatch).

          Workflow run: ${RUN_URL}
          EOF
          )"

          gh label create "${TRACKING_LABEL}" \
            --description "Upstream sync workflow conflict that needs human resolution" \
            --color B60205 \
            --force >/dev/null 2>&1 || true

          EXISTING="$(gh issue list --label "${TRACKING_LABEL}" --state open --json number --jq '.[0].number // empty')"
          if [ -n "${EXISTING}" ]; then
            gh issue edit "${EXISTING}" --title "${TITLE}" --body "${BODY}"
            gh issue comment "${EXISTING}" --body "Sync run ${{ github.run_id }} hit the same conflict. Latest upstream: \`${UPSTREAM_SHA}\`. Conflicts: \`${CONFLICTS:-unknown}\`."
          else
            gh issue create --title "${TITLE}" --body "${BODY}" --label "${TRACKING_LABEL}"
          fi

          printf '::error title=Hermes upstream sync conflict::Manual resolution required. Conflicts: %s\n' "${CONFLICTS:-unknown}"
          exit 1
